server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /media/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
