<div class="placeholder-container">
  <div class="card placeholder-card">
    <div class="placeholder-header">
      <h1 class="placeholder-title">
        Hola, <span class="placeholder-email">{{ currentUser()?.email || 'Usuario' }}</span>
      </h1>
      <p class="placeholder-subtitle">
        Perfil actual: <strong class="placeholder-role">{{ profileLabel() }}</strong>
      </p>
    </div>

    <div class="placeholder-info">
      <p class="text-muted">
        Esta es una vista provisional mientras se completan las pantallas de inicio específicas.
      </p>
    </div>

    <div class="placeholder-actions">
      <button type="button" class="btn btn-outline" (click)="logout()">
        Cerrar sesión
      </button>
    </div>
  </div>
</div>
