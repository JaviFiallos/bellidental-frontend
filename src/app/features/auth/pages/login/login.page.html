<div class="login-layout">
  <!-- Panel de marca -->
  <aside class="brand-panel gradient-brand">
    <div class="brand-content">
      <div class="brand-logo-symbol" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C7.5 2 4 4.5 4 8c0 2.5 1.5 5 2.5 8 .8 2.3 2 4 3.5 4s2-3 2-5c0 2 .5 5 2 5s2.7-1.7 3.5-4c1-3 2.5-5.5 2.5-8 0-3.5-3.5-6-8-6z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1 class="brand-title brand-script">Bellidental</h1>
        <p class="brand-tagline">Centro Odontológico</p>
      </div>
    </div>
  </aside>

  <!-- Panel de formulario -->
  <main class="form-panel">
    <div class="form-container">
      @if (isExpired()) {
        <div class="expired-alert-wrapper">
          <bd-alert variant="warning" role="alert" message="Tu sesión expiró. Vuelve a ingresar." />
        </div>
      }

      <header class="form-header">
        <h2 class="form-title">Iniciar sesión</h2>
        <p class="form-description text-muted">
          Ingresa tus credenciales para acceder al sistema.
        </p>
      </header>

      <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <!-- Campo Correo -->
        <bd-field
          label="Correo electrónico"
          fieldId="email"
          [required]="true"
          [error]="emailError()">
          <input
            id="email"
            type="email"
            class="input"
            autocomplete="username"
            autofocus
            formControlName="email"
            placeholder="correo@ejemplo.com"
            [attr.aria-invalid]="!!emailError()"
            [attr.aria-describedby]="emailError() ? 'email-error' : null"
          />
        </bd-field>

        <!-- Campo Contraseña -->
        <bd-field
          label="Contraseña"
          fieldId="password"
          [required]="true"
          [error]="passwordError()">
          <div class="password-input-wrapper">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              class="input password-input"
              autocomplete="current-password"
              formControlName="password"
              placeholder="••••••••••••"
              [attr.aria-invalid]="!!passwordError()"
              [attr.aria-describedby]="passwordError() ? 'password-error' : null"
            />
            <button
              type="button"
              class="password-toggle-btn"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              @if (showPassword()) {
                <!-- Eye-off icon -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                  <line x1="2" x2="22" y1="2" y2="22"/>
                </svg>
              } @else {
                <!-- Eye icon -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              }
            </button>
          </div>
        </bd-field>

        <!-- Bloque de error general -->
        @if (errorMessage()) {
          <div class="error-alert-wrapper">
            <bd-alert variant="error" role="alert" [message]="errorMessage()" />
          </div>
        }

        <!-- Botón Ingresar -->
        <button
          type="submit"
          class="btn btn-primary submit-btn"
          [disabled]="isLoading()">
          @if (isLoading()) {
            <span class="btn-spinner" aria-hidden="true"></span>
            <span>Ingresando...</span>
          } @else {
            <span>Ingresar</span>
          }
        </button>

        <footer class="form-footer">
          <p class="text-muted footer-text">
            ¿Olvidaste tu contraseña? Pídela al administrador de la clínica.
          </p>
        </footer>
      </form>
    </div>
  </main>
</div>
